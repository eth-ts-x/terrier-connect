# cloudbuild-local.yaml
# Use this for local development / ad-hoc deploys when you don't want to run Terraform.
# Assumes infrastructure already exists (GKE cluster, Cloud SQL, Artifact Registry, etc.)
# Secrets are still fetched from Secret Manager (must be populated after initial terraform apply).
#
# Usage:
#   gcloud builds submit --project "$PROJECT_ID" --config cloudbuild-local.yaml \
#     --substitutions=_DOMAIN_NAME="yourdomain.com" .
#
# To override any substitution, append it to --substitutions.

steps:
  # 1. Build Client Image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--build-arg'
      - 'REACT_APP_GOOGLE_MAPS_API_KEY=$$_MAPS_API_KEY'
      - '--build-arg'
      - 'REACT_APP_API_BASE_URL=${_REACT_APP_API_BASE_URL}'
      - '--build-arg'
      - 'REACT_APP_MEDIA_BASE_URL=${_REACT_APP_MEDIA_BASE_URL}'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/terrier-connect-repo/client:${BUILD_ID}'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/terrier-connect-repo/client:latest'
      - './client'
    secretEnv: ['_MAPS_API_KEY']
    id: 'Build Client'

  # 2. Build Server Image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build',
           '-t', '${_REGION}-docker.pkg.dev/${PROJECT_ID}/terrier-connect-repo/server:${BUILD_ID}',
           '-t', '${_REGION}-docker.pkg.dev/${PROJECT_ID}/terrier-connect-repo/server:latest',
           './server']
    id: 'Build Server'

  # 3. Push Client Images to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '--all-tags', '${_REGION}-docker.pkg.dev/${PROJECT_ID}/terrier-connect-repo/client']
    id: 'Push Client'
    waitFor: ['Build Client']

  # 4. Push Server Images to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '--all-tags', '${_REGION}-docker.pkg.dev/${PROJECT_ID}/terrier-connect-repo/server']
    id: 'Push Server'
    waitFor: ['Build Server']

  # 5. Configure kubectl (no Terraform dependency — cluster already exists)
  - name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        gcloud container clusters get-credentials ${_CLUSTER_NAME} --region ${_REGION}
    id: 'Get GKE Credentials'
    waitFor: ['Push Client', 'Push Server']

  # 6. Render cluster-vars.env and app-secrets.env for Kustomize
  - name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        cat > k8s/overlays/prod/cluster-vars.env << EOF
        DOMAIN_NAME=${_DOMAIN_NAME}
        WWW_DOMAIN_NAME=www.${_DOMAIN_NAME}
        ALLOWED_HOSTS=${_DOMAIN_NAME},www.${_DOMAIN_NAME}
        CLOUDSQL_INSTANCE=${PROJECT_ID}:${_REGION}:${_CLOUDSQL_INSTANCE_NAME}
        GS_PROJECT_ID=${PROJECT_ID}
        GKE_SA_EMAIL=terrier-connect-gke-sa@${PROJECT_ID}.iam.gserviceaccount.com
        EOF
        cat > k8s/overlays/prod/app-secrets.env << EOF
        DB_PASSWORD=$$_DB_PASSWORD
        SECRET_KEY=$$_SECRET_KEY
        EOF
        echo "--- Rendered cluster-vars.env ---"
        cat k8s/overlays/prod/cluster-vars.env
    secretEnv: ['_DB_PASSWORD', '_SECRET_KEY']
    id: 'Render cluster-vars'
    waitFor: ['Get GKE Credentials']

  # 7. Deploy Kubernetes manifests (prod overlay)
  - name: 'gcr.io/cloud-builders/kubectl'
    args: ['apply', '-k', 'k8s/overlays/prod']
    env:
      - 'CLOUDSDK_COMPUTE_REGION=${_REGION}'
      - 'CLOUDSDK_CONTAINER_CLUSTER=${_CLUSTER_NAME}'
    id: 'Kustomize Apply'
    waitFor: ['Render cluster-vars']

  # 8. Update images to current build
  - name: 'gcr.io/cloud-builders/kubectl'
    args:
      - 'set'
      - 'image'
      - 'deployment/server'
      - 'server=${_REGION}-docker.pkg.dev/${PROJECT_ID}/terrier-connect-repo/server:${BUILD_ID}'
    env:
      - 'CLOUDSDK_COMPUTE_REGION=${_REGION}'
      - 'CLOUDSDK_CONTAINER_CLUSTER=${_CLUSTER_NAME}'
    id: 'Update Server Image'
    waitFor: ['Kustomize Apply']

  - name: 'gcr.io/cloud-builders/kubectl'
    args:
      - 'set'
      - 'image'
      - 'deployment/client'
      - 'client=${_REGION}-docker.pkg.dev/${PROJECT_ID}/terrier-connect-repo/client:${BUILD_ID}'
    env:
      - 'CLOUDSDK_COMPUTE_REGION=${_REGION}'
      - 'CLOUDSDK_CONTAINER_CLUSTER=${_CLUSTER_NAME}'
    id: 'Update Client Image'
    waitFor: ['Kustomize Apply']

  - name: 'gcr.io/cloud-builders/kubectl'
    args: ['rollout', 'status', 'deployment/server']
    env:
      - 'CLOUDSDK_COMPUTE_REGION=${_REGION}'
      - 'CLOUDSDK_CONTAINER_CLUSTER=${_CLUSTER_NAME}'
    id: 'Rollout Server'
    waitFor: ['Update Server Image']

  - name: 'gcr.io/cloud-builders/kubectl'
    args: ['rollout', 'status', 'deployment/client']
    env:
      - 'CLOUDSDK_COMPUTE_REGION=${_REGION}'
      - 'CLOUDSDK_CONTAINER_CLUSTER=${_CLUSTER_NAME}'
    id: 'Rollout Client'
    waitFor: ['Update Client Image']

availableSecrets:
  secretManager:
    - versionName: projects/${PROJECT_ID}/secrets/terrier-connect-db-password/versions/latest
      env: '_DB_PASSWORD'
    - versionName: projects/${PROJECT_ID}/secrets/terrier-connect-django-secret-key/versions/latest
      env: '_SECRET_KEY'
    - versionName: projects/${PROJECT_ID}/secrets/terrier-connect-maps-api-key/versions/latest
      env: '_MAPS_API_KEY'

substitutions:
  _REGION: us-central1
  _CLUSTER_NAME: terrier-connect-gke
  _DOMAIN_NAME: example.com
  _CLOUDSQL_INSTANCE_NAME: terrier-connect-db
  _REACT_APP_API_BASE_URL: /api
  _REACT_APP_MEDIA_BASE_URL: /media

images:
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/terrier-connect-repo/client:${BUILD_ID}'
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/terrier-connect-repo/client:latest'
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/terrier-connect-repo/server:${BUILD_ID}'
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/terrier-connect-repo/server:latest'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'

# Pin to the dedicated Cloud Build SA (created by Terraform).
# Uses built-in ${PROJECT_ID} so no project ID is hardcoded here.
serviceAccount: 'projects/${PROJECT_ID}/serviceAccounts/terrier-connect-cloudbuild-sa@${PROJECT_ID}.iam.gserviceaccount.com'
