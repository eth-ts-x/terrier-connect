steps:
  # 1. Build Client Image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--build-arg'
      - 'REACT_APP_GOOGLE_MAPS_API_KEY=${_REACT_APP_GOOGLE_MAPS_API_KEY}'
      - '--build-arg'
      - 'REACT_APP_API_BASE_URL=${_REACT_APP_API_BASE_URL}'
      - '--build-arg'
      - 'REACT_APP_MEDIA_BASE_URL=${_REACT_APP_MEDIA_BASE_URL}'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/terrier-connect-repo/client:${BUILD_ID}'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/terrier-connect-repo/client:latest'
      - './client'
    id: 'Build Client'

  # 2. Build Server Image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', '${_REGION}-docker.pkg.dev/${PROJECT_ID}/terrier-connect-repo/server:${BUILD_ID}',
           '-t', '${_REGION}-docker.pkg.dev/${PROJECT_ID}/terrier-connect-repo/server:latest', './server']
    id: 'Build Server'

  # 3. Push Client Images to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '--all-tags', '${_REGION}-docker.pkg.dev/${PROJECT_ID}/terrier-connect-repo/client']
    id: 'Push Client'
    waitFor: ['Build Client']

  # 4. Push Server Images to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '--all-tags', '${_REGION}-docker.pkg.dev/${PROJECT_ID}/terrier-connect-repo/server']
    id: 'Push Server'
    waitFor: ['Build Server']

  # 5. Terraform Init
  - name: 'hashicorp/terraform:1.5.7'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        cd infrastructure
        terraform init -backend-config="bucket=${PROJECT_ID}-tf-state"
    id: 'Terraform Init'
    waitFor: ['Push Client', 'Push Server']

  # 6. Terraform Plan
  - name: 'hashicorp/terraform:1.5.7'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        cd infrastructure
        terraform plan -out=tfplan \
          -var="project_id=${PROJECT_ID}" \
          -var="region=${_REGION}" \
          -var="zone=${_ZONE}" \
          -var="domain_name=${_DOMAIN_NAME}" \
          -var="dns_zone_name=${_DNS_ZONE_NAME}" \
          -var="db_password=${_DB_PASSWORD}"
    id: 'Terraform Plan'
    waitFor: ['Terraform Init']

  # 7. Terraform Apply
  - name: 'hashicorp/terraform:1.5.7'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        cd infrastructure
        terraform apply -auto-approve tfplan
    id: 'Terraform Apply'
    waitFor: ['Terraform Plan']

  # 8. Configure kubectl to talk to GKE
  - name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        gcloud container clusters get-credentials ${_CLUSTER_NAME} --region ${_REGION}
    id: 'Get GKE Credentials'
    waitFor: ['Terraform Apply']

  # 9. Render cluster-vars.env for Kustomize replacements
  - name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        cat > k8s/overlays/prod/cluster-vars.env << EOF
        DOMAIN_NAME=${_DOMAIN_NAME}
        WWW_DOMAIN_NAME=www.${_DOMAIN_NAME}
        ALLOWED_HOSTS=${_DOMAIN_NAME},www.${_DOMAIN_NAME}
        CLOUDSQL_INSTANCE=${PROJECT_ID}:${_REGION}:${_CLOUDSQL_INSTANCE_NAME}
        GS_PROJECT_ID=${PROJECT_ID}
        GKE_SA_EMAIL=terrier-connect-gke-sa@${PROJECT_ID}.iam.gserviceaccount.com
        EOF
        echo "--- Rendered cluster-vars.env ---"
        cat k8s/overlays/prod/cluster-vars.env
    id: 'Render cluster-vars'
    waitFor: ['Get GKE Credentials']

  # 10. Deploy Kubernetes manifests (prod overlay)
  - name: 'gcr.io/cloud-builders/kubectl'
    args: ['apply', '-k', 'k8s/overlays/prod']
    env:
      - 'CLOUDSDK_COMPUTE_REGION=${_REGION}'
      - 'CLOUDSDK_CONTAINER_CLUSTER=${_CLUSTER_NAME}'
    id: 'Kustomize Apply'
    waitFor: ['Render cluster-vars']

  # 11. Update images to current build
  - name: 'gcr.io/cloud-builders/kubectl'
    args:
      - 'set'
      - 'image'
      - 'deployment/server'
      - 'server=${_REGION}-docker.pkg.dev/${PROJECT_ID}/terrier-connect-repo/server:${BUILD_ID}'
    env:
      - 'CLOUDSDK_COMPUTE_REGION=${_REGION}'
      - 'CLOUDSDK_CONTAINER_CLUSTER=${_CLUSTER_NAME}'
    id: 'Update Server Image'
    waitFor: ['Kustomize Apply']

  - name: 'gcr.io/cloud-builders/kubectl'
    args:
      - 'set'
      - 'image'
      - 'deployment/client'
      - 'client=${_REGION}-docker.pkg.dev/${PROJECT_ID}/terrier-connect-repo/client:${BUILD_ID}'
    env:
      - 'CLOUDSDK_COMPUTE_REGION=${_REGION}'
      - 'CLOUDSDK_CONTAINER_CLUSTER=${_CLUSTER_NAME}'
    id: 'Update Client Image'
    waitFor: ['Kustomize Apply']

  - name: 'gcr.io/cloud-builders/kubectl'
    args: ['rollout', 'status', 'deployment/server']
    env:
      - 'CLOUDSDK_COMPUTE_REGION=${_REGION}'
      - 'CLOUDSDK_CONTAINER_CLUSTER=${_CLUSTER_NAME}'
    id: 'Rollout Server'
    waitFor: ['Update Server Image']

  - name: 'gcr.io/cloud-builders/kubectl'
    args: ['rollout', 'status', 'deployment/client']
    env:
      - 'CLOUDSDK_COMPUTE_REGION=${_REGION}'
      - 'CLOUDSDK_CONTAINER_CLUSTER=${_CLUSTER_NAME}'
    id: 'Rollout Client'
    waitFor: ['Update Client Image']

substitutions:
  _REGION: us-central1
  _ZONE: us-central1-a
  _CLUSTER_NAME: terrier-connect-gke
  _DOMAIN_NAME: example.com
  _DNS_ZONE_NAME: terrier-connect-zone
  _CLOUDSQL_INSTANCE_NAME: terrier-connect-db
  _REACT_APP_GOOGLE_MAPS_API_KEY: CHANGE_ME
  _REACT_APP_API_BASE_URL: /api
  _REACT_APP_MEDIA_BASE_URL: /media
  _DB_PASSWORD: CHANGE_ME

images:
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/terrier-connect-repo/client:${BUILD_ID}'
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/terrier-connect-repo/client:latest'
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/terrier-connect-repo/server:${BUILD_ID}'
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/terrier-connect-repo/server:latest'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'
