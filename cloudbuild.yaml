steps:
  # 1. Build Client Image
  # Must use entrypoint bash so $$_MAPS_API_KEY (secretEnv) gets shell-expanded.
  # Using args directly would pass the literal string "$_MAPS_API_KEY" to docker.
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        docker build \
          --build-arg REACT_APP_GOOGLE_MAPS_API_KEY=$$_MAPS_API_KEY \
          --build-arg REACT_APP_API_BASE_URL=${_REACT_APP_API_BASE_URL} \
          --build-arg REACT_APP_MEDIA_BASE_URL=${_REACT_APP_MEDIA_BASE_URL} \
          --build-arg REACT_APP_GRAPHQL_URL=${_REACT_APP_GRAPHQL_URL} \
          -t ${_REGION}-docker.pkg.dev/${PROJECT_ID}/terrier-connect-repo/client:${BUILD_ID} \
          -t ${_REGION}-docker.pkg.dev/${PROJECT_ID}/terrier-connect-repo/client:latest \
          ./client
    secretEnv: ['_MAPS_API_KEY']
    id: 'Build Client'

  # 2. Build Server Image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', '${_REGION}-docker.pkg.dev/${PROJECT_ID}/terrier-connect-repo/server:${BUILD_ID}',
           '-t', '${_REGION}-docker.pkg.dev/${PROJECT_ID}/terrier-connect-repo/server:latest', './server']
    id: 'Build Server'

  # 3. Build Gateway Image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', '${_REGION}-docker.pkg.dev/${PROJECT_ID}/terrier-connect-repo/gateway:${BUILD_ID}',
           '-t', '${_REGION}-docker.pkg.dev/${PROJECT_ID}/terrier-connect-repo/gateway:latest', './gateway']
    id: 'Build Gateway'

  # 4. Push Client Images to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '--all-tags', '${_REGION}-docker.pkg.dev/${PROJECT_ID}/terrier-connect-repo/client']
    id: 'Push Client'
    waitFor: ['Build Client']

  # 5. Push Server Images to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '--all-tags', '${_REGION}-docker.pkg.dev/${PROJECT_ID}/terrier-connect-repo/server']
    id: 'Push Server'
    waitFor: ['Build Server']

  # 6. Push Gateway Images to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '--all-tags', '${_REGION}-docker.pkg.dev/${PROJECT_ID}/terrier-connect-repo/gateway']
    id: 'Push Gateway'
    waitFor: ['Build Gateway']

  # 7. Configure kubectl to talk to GKE
  - name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        gcloud container clusters get-credentials ${_CLUSTER_NAME} --region ${_REGION}
    id: 'Get GKE Credentials'
    waitFor: ['Push Client', 'Push Server', 'Push Gateway']

  # 8. Render Helm values and deploy release
  - name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
        cat > /workspace/helm/terrier-connect/ci-values.generated.yaml << EOF
        client:
          image:
            repository: ${_REGION}-docker.pkg.dev/${PROJECT_ID}/terrier-connect-repo/client
            tag: ${BUILD_ID}
        server:
          image:
            repository: ${_REGION}-docker.pkg.dev/${PROJECT_ID}/terrier-connect-repo/server
            tag: ${BUILD_ID}
        gateway:
          image:
            repository: ${_REGION}-docker.pkg.dev/${PROJECT_ID}/terrier-connect-repo/gateway
            tag: ${BUILD_ID}
          corsOrigin: https://${_DOMAIN_NAME},https://www.${_DOMAIN_NAME}
        appConfig:
          ALLOWED_HOSTS: ${_DOMAIN_NAME},www.${_DOMAIN_NAME}
          GS_PROJECT_ID: ${PROJECT_ID}
        secrets:
          DB_PASSWORD: $$_DB_PASSWORD
          SECRET_KEY: $$_SECRET_KEY
        serviceAccount:
          annotations:
            iam.gke.io/gcp-service-account: terrier-connect-gke-sa@${PROJECT_ID}.iam.gserviceaccount.com
        cloudSqlProxy:
          enabled: true
          instanceConnectionName: ${PROJECT_ID}:${_REGION}:${_CLOUDSQL_INSTANCE_NAME}
        ingress:
          hosts:
            - host: ${_DOMAIN_NAME}
            - host: www.${_DOMAIN_NAME}
        EOF
        helm lint /workspace/helm/terrier-connect -f /workspace/helm/terrier-connect/ci-values.generated.yaml
        helm upgrade --install ${_HELM_RELEASE_NAME} /workspace/helm/terrier-connect \
          --namespace ${_K8S_NAMESPACE} \
          --create-namespace \
          -f /workspace/helm/terrier-connect/ci-values.generated.yaml \
          --wait \
          --timeout 10m
    secretEnv: ['_DB_PASSWORD', '_SECRET_KEY']
    id: 'Helm Deploy'
    waitFor: ['Get GKE Credentials']

availableSecrets:
  secretManager:
    - versionName: projects/${PROJECT_ID}/secrets/terrier-connect-db-password/versions/latest
      env: '_DB_PASSWORD'
    - versionName: projects/${PROJECT_ID}/secrets/terrier-connect-django-secret-key/versions/latest
      env: '_SECRET_KEY'
    - versionName: projects/${PROJECT_ID}/secrets/terrier-connect-maps-api-key/versions/latest
      env: '_MAPS_API_KEY'

substitutions:
  _REGION: us-central1
  _CLUSTER_NAME: terrier-connect-gke
  _DOMAIN_NAME: example.com
  _CLOUDSQL_INSTANCE_NAME: terrier-connect-db
  _K8S_NAMESPACE: terrier-connect
  _HELM_RELEASE_NAME: terrier-connect
  _REACT_APP_API_BASE_URL: /api
  _REACT_APP_MEDIA_BASE_URL: /media
  _REACT_APP_GRAPHQL_URL: /graphql

images:
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/terrier-connect-repo/client:${BUILD_ID}'
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/terrier-connect-repo/client:latest'
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/terrier-connect-repo/server:${BUILD_ID}'
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/terrier-connect-repo/server:latest'
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/terrier-connect-repo/gateway:${BUILD_ID}'
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/terrier-connect-repo/gateway:latest'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'
