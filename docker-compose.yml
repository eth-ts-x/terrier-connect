version: "3.8"

services:
  client:
    build:
      context: ./client
      args:
        - REACT_APP_GOOGLE_MAPS_API_KEY=${REACT_APP_GOOGLE_MAPS_API_KEY}
    image: client-tc
    container_name: client
    ports:
      - "3002:80"
    depends_on:
      - server
    # Need to customize the nginx config for production
    volumes:
      - ./client/nginx_conf/nginx_dev.conf:/etc/nginx/nginx.conf
    networks:
      - tc-network

  server:
    build:
      context: ./server
    image: server-tc
    container_name: server
    ports:
      - "8000:8000"
    env_file:
      - ./server/.env
    volumes:
      - ./server:/app
    environment:
      - DEBUG=1
    depends_on:
      - db
    networks:
      - tc-network

# Currently can use dev DB, don't commit the password to the repo
  db:
    image: postgres:17
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=CHANGE_ME
      - POSTGRES_DB=terrier-connect-dev
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - tc-network

volumes:
  db_data:

networks:
  tc-network:
    driver: bridge