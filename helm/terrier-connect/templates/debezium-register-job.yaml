{{- if and .Values.debezium.enabled .Values.debezium.connectUrl }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "terrier-connect.fullname" . }}-debezium-register
  labels:
    {{- include "terrier-connect.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        {{- include "terrier-connect.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: debezium-register
    spec:
      restartPolicy: OnFailure
      containers:
        - name: register
          image: python:3.12-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: KAFKA_CONNECT_URL
              value: {{ .Values.debezium.connectUrl | quote }}
            - name: DEBEZIUM_CONNECTOR_NAME
              value: {{ .Values.debezium.connectorName | quote }}
            - name: REGISTER_TIMEOUT_SECONDS
              value: {{ .Values.debezium.registerTimeoutSeconds | quote }}
          envFrom:
            - secretRef:
                name: {{ include "terrier-connect.fullname" . }}-debezium-secrets
          command:
            - python
            - -c
            - |
              import json
              import os
              import pathlib
              import re
              import time
              import urllib.error
              import urllib.parse
              import urllib.request

              connect_url = os.environ["KAFKA_CONNECT_URL"].rstrip("/")
              connector_name = os.environ["DEBEZIUM_CONNECTOR_NAME"]
              timeout_seconds = int(os.environ.get("REGISTER_TIMEOUT_SECONDS", "180"))
              template = pathlib.Path("/config/postgres-follow-source.json").read_text()
              placeholder_re = re.compile(r"\$\{([A-Z0-9_]+)\}")
              placeholders = set(placeholder_re.findall(template))
              missing = sorted(name for name in placeholders if os.getenv(name) is None)
              if missing:
                  raise SystemExit(f"Missing environment variables: {', '.join(missing)}")
              rendered = template
              for name in placeholders:
                  rendered = rendered.replace("${" + name + "}", os.environ[name])
              document = json.loads(rendered)
              payload = document.get("config", document)
              connector_name = document.get("name", connector_name)
              deadline = time.time() + timeout_seconds
              while True:
                  try:
                      with urllib.request.urlopen(f"{connect_url}/connectors", timeout=10) as response:
                          print(f"Kafka Connect ready: {response.status}")
                          break
                  except Exception as exc:
                      if time.time() >= deadline:
                          raise SystemExit(f"Kafka Connect not ready before timeout: {exc}")
                      print(f"Waiting for Kafka Connect: {exc}")
                      time.sleep(5)
              request = urllib.request.Request(
                  f"{connect_url}/connectors/{urllib.parse.quote(connector_name)}/config",
                  data=json.dumps(payload).encode("utf-8"),
                  headers={"Content-Type": "application/json"},
                  method="PUT",
              )
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      body = response.read().decode("utf-8")
                      print(body)
              except urllib.error.HTTPError as exc:
                  detail = exc.read().decode("utf-8", errors="replace")
                  raise SystemExit(f"Connector registration failed: {exc.code} {detail}")
          volumeMounts:
            - name: connector-config
              mountPath: /config
              readOnly: true
      volumes:
        - name: connector-config
          configMap:
            name: {{ include "terrier-connect.fullname" . }}-debezium-connectors
{{- end }}
