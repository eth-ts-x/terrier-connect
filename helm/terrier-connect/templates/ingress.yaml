{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "terrier-connect.fullname" . }}-ingress
  labels:
    {{- include "terrier-connect.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "terrier-connect.fullname" $ }}-server
                port:
                  number: {{ $.Values.server.service.port }}
          - path: /media
            pathType: Prefix
            backend:
              service:
                name: {{ include "terrier-connect.fullname" $ }}-server
                port:
                  number: {{ $.Values.server.service.port }}
          - path: /graphql
            pathType: Prefix
            backend:
              service:
                name: {{ include "terrier-connect.fullname" $ }}-gateway
                port:
                  number: {{ $.Values.gateway.service.port }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "terrier-connect.fullname" $ }}-client
                port:
                  number: {{ $.Values.client.service.port }}
    {{- end }}
{{- end }}
