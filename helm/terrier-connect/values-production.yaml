# Production sizing overrides for the current GKE quota envelope.
# Keep user-facing workloads at a single replica so Helm rollouts do not stall
# waiting on unschedulable pods during Cloud Build deployments.

client:
  replicaCount: 1

server:
  replicaCount: 1

gateway:
  replicaCount: 1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

workerResources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi