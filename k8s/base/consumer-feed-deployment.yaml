apiVersion: apps/v1
kind: Deployment
metadata:
  name: consumer-feed
spec:
  replicas: 1
  selector:
    matchLabels:
      app: consumer-feed
  template:
    metadata:
      labels:
        app: consumer-feed
    spec:
      serviceAccountName: server
      containers:
        - name: consumer
          image: server
          command: ["python", "manage.py", "run_consumer", "--consumer", "feed_fanout"]
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets
