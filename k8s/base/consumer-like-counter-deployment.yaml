apiVersion: apps/v1
kind: Deployment
metadata:
  name: consumer-like-counter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: consumer-like-counter
  template:
    metadata:
      labels:
        app: consumer-like-counter
    spec:
      serviceAccountName: server
      containers:
        - name: consumer
          image: server
          command: ["python", "manage.py", "run_consumer", "--consumer", "like_counter"]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          env:
            - name: SKIP_STARTUP_INIT
              value: "1"
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets
