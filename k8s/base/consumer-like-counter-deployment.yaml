apiVersion: apps/v1
kind: Deployment
metadata:
  name: consumer-like-counter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: consumer-like-counter
  template:
    metadata:
      labels:
        app: consumer-like-counter
    spec:
      serviceAccountName: server
      containers:
        - name: consumer
          image: server
          command: ["python", "manage.py", "run_consumer", "--consumer", "like_counter"]
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets
