    spec:
      containers:
        - name: consumer
          image: server-tc
          imagePullPolicy: IfNotPresent
          command: ["python", "manage.py", "run_consumer", "--consumer", "notification"]
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: consumer-like-counter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: consumer-like-counter
  template:
    metadata:
      labels:
        app: consumer-like-counter
    spec:
      containers:
        - name: consumer
          image: server-tc
